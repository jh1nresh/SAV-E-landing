name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate metro data, glyphs, and forbidden strings
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Build production site
        env:
          NEXT_PUBLIC_TESTFLIGHT_URL: https://testflight.apple.com/join/ci-placeholder
        run: npm run build

      - name: Verify Next.js build artifact
        run: test -s .next/BUILD_ID

      - name: Recheck build output
        run: npm run check

      - name: Install Playwright browsers
        run: |
          # Keep the runner's official HTTPS archive/security fallbacks; skip the stalled Azure mirror.
          grep -q '^https://archive\.ubuntu\.com/ubuntu/' /etc/apt/apt-mirrors.txt
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/[[:space:]]|d' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium webkit

      - name: Unit and Playwright tests
        env:
          CI: "true"
          NEXT_PUBLIC_TESTFLIGHT_URL: https://testflight.apple.com/join/ci-placeholder
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Keep guide viewport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guide-screenshots-${{ github.sha }}
          path: guide-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
